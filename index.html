    <!-- Primary SEO Meta Tags -->

    <!-- Structured Data for LLM & Search Engines -->
    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Astradev Studios",
      "description": "Premium web design and development studio specializing in custom websites, web applications, Android apps, and automation solutions.",
      "url": "https://astradev.studio",
      "email": "astradevsstudio@gmail.com",
      "serviceType": ["Web Design", "Web Development", "Android App Development", "Automation Solutions"],
      "areaServed": "Worldwide",
      "priceRange": "$$",
      "knowsAbout": ["React", "Next.js", "TypeScript", "Node.js", "Tailwind CSS", "Three.js", "GSAP", "Kotlin", "Python", "MongoDB"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Digital Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Web Design",
              "description": "Visually stunning, responsive websites with modern UI/UX design"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Web Applications",
              "description": "Scalable web apps using React, Node.js, and modern frameworks"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Android Applications",
              "description": "Sleek, functional Android apps using Kotlin and Java"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Automation Solutions",
              "description": "Custom automation tools using Python, Selenium, and modern tooling"
            }
          }
        ]
      }
    }
    </script>

    <meta name="llm:name" content="Astradev Studios" />

    <meta name="llm:services" content="Web Design, Web Development, Android Apps, Automation" />
    <meta name="llm:contact" content="astradevsstudio@gmail.com" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
